<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7c3f18">
  <title>Palatschinken-Stand – Verkaufszähler</title>
  <style>
    :root { color-scheme:light; --ink:#302218; --muted:#76685c; --cream:#fff8ed; --paper:#fffdf9; --brown:#7c3f18; --line:#ead9c5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top,#fff0cc,var(--cream) 62%); color:var(--ink); font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,560px); text-align:center; background:var(--paper); border:1px solid var(--line); border-radius:28px; padding:clamp(24px,6vw,48px); box-shadow:0 18px 60px #633a1712; }
    .emoji { font-size:54px; line-height:1.2; }
    .eyebrow { margin:12px 0 8px; color:var(--brown); font-size:.78rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(2rem,7vw,3rem); letter-spacing:-.04em; }
    .intro { color:var(--muted); line-height:1.6; margin:12px auto 28px; max-width:36ch; }
    .counter { border-radius:22px; background:#fff2d6; padding:22px 16px; border:1px solid #f4dfb1; }
    .number { display:block; font-size:clamp(4rem,18vw,6.5rem); line-height:1; font-weight:900; letter-spacing:-.06em; color:var(--brown); font-variant-numeric:tabular-nums; }
    .unit { display:block; margin-top:10px; font-weight:750; }
    .updated { min-height:1.4em; margin:12px 0 0; font-size:.84rem; color:var(--muted); }
    .error { color:#9e2828; }
    footer { margin-top:28px; font-size:.8rem; color:var(--muted); }
    footer a { color:inherit; }
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">🥞</div>
    <p class="eyebrow">Frisch aus der Pfanne</p>
    <h1>Palatschinken-Stand</h1>
    <p class="intro">Jede verkaufte Palatschinke zählt. Hier seht ihr alle gemeinsam den aktuellen Verkaufsstand!</p>
    <section class="counter" aria-live="polite" aria-atomic="true">
      <span class="number" id="total">…</span>
      <span class="unit">Palatschinken verkauft</span>
      <p class="updated" id="updated">Verkaufszahl wird geladen …</p>
    </section>
    <footer>Öffentliche Verkaufsanzeige · Aktualisiert automatisch</footer>
  </main>
  <script src="./config.js"></script>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const totalEl = document.getElementById("total");
    const updatedEl = document.getElementById("updated");
    const configured = window.SUPABASE_URL && window.SUPABASE_ANON_KEY &&
      !window.SUPABASE_URL.includes("DEIN-PROJEKT") &&
      !window.SUPABASE_ANON_KEY.includes("DEIN-ANON-KEY");
    function showError(message) {
      totalEl.textContent = "–";
      updatedEl.textContent = message;
      updatedEl.classList.add("error");
    }
    if (!configured) {
      showError("Datenbank noch nicht eingerichtet.");
    } else {
      const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      async function loadSales() {
        const { data, error } = await supabase.from("sales").select("total, updated_at").eq("id", 1).single();
        if (error || !data) {
          showError("Verkaufszahl gerade nicht verfügbar.");
          return;
        }
        totalEl.textContent = new Intl.NumberFormat("de-AT").format(Number(data.total) || 0);
        updatedEl.textContent = data.updated_at
          ? "Zuletzt aktualisiert: " + new Date(data.updated_at).toLocaleString("de-AT")
          : "Noch keine Verkäufe registriert";
        updatedEl.classList.remove("error");
      }
      loadSales();
      setInterval(loadSales, 10000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) loadSales(); });
    }
  </script>
</body>
</html>
